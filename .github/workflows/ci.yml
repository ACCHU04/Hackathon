name: CI

on:
  push:
    branches: [main, "scaffold/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            httpx openai \
            langchain langchain-core langchain-openai langchain-community \
            duckduckgo-search \
            pytest pytest-asyncio \
            python-dotenv python-multipart tenacity \
            ruff

      - name: Lint with ruff
        run: ruff check backend/app --select E,F,W,I --ignore E501

      - name: Run tests (mock mode — no API key needed)
        env:
          OPENAI_API_KEY: ""
          SERPAPI_KEY: ""
        run: |
          cd backend
          python -m pytest app/tests/ -v --tb=short

  frontend-lint:
    name: Frontend — type-check & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        working-directory: frontend
        run: npx next lint --dir src
        continue-on-error: true
